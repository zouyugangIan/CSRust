[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[workspace.dependencies]
atomic-write-file = "0.3.0"
gpui = "0.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.27.0"
thiserror = "2.0.19"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
unwrap_used = "deny"

# GUI 与路径细分在 opt-level=0 下会明显卡顿；保留业务代码的快速 Debug 编译，
# 只优化 GPUI 及其 Canvas 几何依赖。
[profile.dev.package.gpui]
opt-level = 2

[profile.dev.package.lyon_algorithms]
opt-level = 3

[profile.dev.package.lyon_geom]
opt-level = 2

[profile.dev.package.lyon_path]
opt-level = 2

[profile.dev.package.lyon_tessellation]
opt-level = 3
